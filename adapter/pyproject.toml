[project]
name = "sgmcp-adapter-generic"
version = "0.1.0"
description = "Generic Supabase session/write adapter for WAI employees, driven by configuration instead of per-business code."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "fastapi>=0.115,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
